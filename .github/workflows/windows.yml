name: Windows build

on:
  push:
    paths: ["src/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["src/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build src -c Release
